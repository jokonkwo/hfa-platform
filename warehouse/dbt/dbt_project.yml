name: "hfa_warehouse"
version: "0.1.0"
config-version: 2

profile: "hfa_warehouse"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  
on-run-start:
  - "INSTALL spatial;"
  - "LOAD spatial;"

models:
  hfa_warehouse:
    +materialized: view
    raw:
      +schema: raw
      +materialized: view
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
    ops:
      +schema: ops
      +materialized: table
