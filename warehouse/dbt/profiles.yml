hfa_warehouse:
  target: local
  outputs:

    # Local dev: writes to a DuckDB file on disk
    local:
      type: duckdb
      path: "{{ env_var('HFA_DUCKDB_PATH', './data/local/hfa.duckdb') }}"
      threads: 4

    # MotherDuck (active dev target: HFA_DEV)
    #
    # MOTHERDUCK_TOKEN is stored as mdt_<jwt> (the format shown in the MotherDuck UI).
    # DuckDB's local MotherDuck extension requires the raw JWT without the mdt_ prefix;
    # the [4:] slice strips it. If your token doesn't start with mdt_ (e.g. already raw),
    # remove the [4:].
    motherduck:
      type: duckdb
      path: "md:{{ env_var('MOTHERDUCK_DATABASE', 'hfa_dev') }}"
      threads: 4
      settings:
        motherduck_token: "{{ env_var('MOTHERDUCK_TOKEN')[4:] }}"
