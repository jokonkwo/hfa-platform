hfa_warehouse:
  target: local
  outputs:

    # Local dev: writes to a DuckDB file on disk
    local:
      type: duckdb
      path: "{{ env_var('HFA_DUCKDB_PATH', './data/local/hfa.duckdb') }}"
      threads: 4

    # MotherDuck (active dev target: HFA_DEV)
    #
    # Strip mdt_ prefix if present — duckdb.connect() requires the raw JWT.
    # Handles tokens stored with or without the prefix.
    motherduck:
      type: duckdb
      path: "md:{{ env_var('MOTHERDUCK_DATABASE', 'hfa_dev') }}"
      threads: 4
      plugins:
        - module: motherduck
          config:
            motherduck_token: "{{ env_var('MOTHERDUCK_TOKEN')[4:] if env_var('MOTHERDUCK_TOKEN').startswith('mdt_') else env_var('MOTHERDUCK_TOKEN') }}"
