hfa_warehouse:
  target: local
  outputs:

    # Local dev: writes to a DuckDB file on disk
    local:
      type: duckdb
      path: "{{ env_var('HFA_DUCKDB_PATH', './data/local/hfa.duckdb') }}"
      threads: 4

    # MotherDuck (active dev target: HFA_DEV)
    #
    # MOTHERDUCK_TOKEN is stored as mdt_<jwt> (the format shown in the MotherDuck UI).
    # The [4:] slice strips the mdt_ prefix — DuckDB's connect() config requires the
    # raw JWT. The token is passed via plugins.config (not settings) so it reaches
    # duckdb.connect() as a config kwarg rather than via SET, which is initialization-only.
    motherduck:
      type: duckdb
      path: "md:{{ env_var('MOTHERDUCK_DATABASE', 'hfa_dev') }}"
      threads: 4
      plugins:
        - module: motherduck
          config:
            motherduck_token: "{{ env_var('MOTHERDUCK_TOKEN')[4:] }}"
