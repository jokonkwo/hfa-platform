version: 2

sources:
  - name: bronze
    description: "Bronze tables populated by Python ingestion pipelines — not managed by dbt."
    schema: main
    tables:
      - name: bronze_sensor_now_raw_10min
        description: "Raw PurpleAir 10-min poll results. One row per sensor per poll."
        columns:
          - name: ts_utc
            tests: [not_null]
          - name: sensor_index
            tests: [not_null]
          - name: pm25_cf1_a
            tests: [not_null]
          - name: pm25_cf1_b
            tests: [not_null]
          - name: humidity_a
            tests: [not_null]

      - name: bronze_panel_zipmap_daily
        description: "Daily panel of selected sensors with ZIP assignment."
        columns:
          - name: sensor_index
            tests: [not_null]
          - name: zip
            tests: [not_null]
          - name: date
            tests: [not_null]

      - name: bronze_discovery_daily
        description: "Daily discovery results — fresh-sensor counts per ZIP."
        columns:
          - name: date
            tests: [not_null]
          - name: zip
            tests: [not_null]

      - name: bronze_panel_show_only_daily
        description: "Sensor IDs in the active panel (no ZIP attribution)."
        columns:
          - name: date
            tests: [not_null]
          - name: sensor_index
            tests: [not_null]
