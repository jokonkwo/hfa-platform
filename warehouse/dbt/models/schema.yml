version: 2

models:
  - name: silver_sensor_corrected_10min
    description: "Per-sensor corrected PM2.5 with QC flags, joined to ZIP via panel map."
    columns:
      - name: ts_utc
        tests: [not_null]
      - name: sensor_index
        tests: [not_null]
      - name: zip
        tests: [not_null]
      - name: pm25_corr
        tests: [not_null]
      - name: ab_agree
        tests: [not_null]

  - name: silver_zip_now_10min
    description: "ZIP-level corrected PM2.5 rollup for every 10-min poll snapshot."
    columns:
      - name: ts_utc
        tests: [not_null]
      - name: zip
        tests: [not_null]
      - name: pm25_corr
        tests: [not_null]
      - name: aqi
        tests: [not_null]
      - name: qc_badge
        tests: [not_null]

  - name: silver_zip_hourly
    description: "Hourly ZIP-level PM2.5 rollup aggregated from 10-min corrected readings."
    columns:
      - name: hour_utc
        tests: [not_null]
      - name: zip
        tests: [not_null]
      - name: pm25_corr
        tests: [not_null]

  - name: silver_zip_daily
    description: "Daily ZIP-level PM2.5 stats (mean, p95, max) and AQI exceedance counts."
    columns:
      - name: date
        tests: [not_null]
      - name: zip
        tests: [not_null]
      - name: pm25_mean
        tests: [not_null]

  - name: gold_zip_now
    description: "API-ready current conditions per ZIP — one row per active ZIP, latest snapshot only."
    columns:
      - name: zip
        tests: [not_null, unique]
      - name: pm25
        tests: [not_null]
      - name: aqi
        tests: [not_null]
      - name: category
        tests: [not_null]
      - name: updated_ts
        tests: [not_null]
