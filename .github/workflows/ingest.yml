# PurpleAir ingestion — runs every 10 minutes.
#
# IMPORTANT: GitHub Actions `on.schedule` is best-effort and can lag 5–30+ minutes,
# making it unsuitable as the sole trigger for a 10-minute freshness target.
#
# PRIMARY TRIGGER: workflow_dispatch, called by an external scheduler every 10 minutes.
# FALLBACK TRIGGER: on.schedule kept as a backup if the external scheduler goes down.
#
# External scheduler setup (one-time, manual):
#   See docs/scheduling.md for the full setup guide.
#   Short version: configure cron-job.org (or equivalent) to POST to
#   https://api.github.com/repos/jokonkwo/hfa-platform/actions/workflows/ingest.yml/dispatches
#   every 10 minutes with a GitHub token that has the `workflow` scope.

name: Ingest PurpleAir

on:
  schedule:
    # Fallback only — GitHub may delay this by 5–30+ min. See header note above.
    - cron: "*/10 * * * *"

  workflow_dispatch:
    # Primary trigger — called by external scheduler via GitHub API.
    # No inputs required; all config comes from repository secrets.

jobs:
  load-raw:
    name: Load raw PurpleAir readings
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      HFA_ENV: staging
      HFA_WAREHOUSE_MODE: motherduck
      MOTHERDUCK_DATABASE: hfa_dev
      PURPLEAIR_SENSOR_IDS: "473,8892,27111,29869,39049,42291,42327,46571,62137,80125,83229,85495,85615,87251,97847,104230,111391,114721,121933,123359,124099,134022,155829,163097,163115,163163,163167,167071,189863,197623,198871,237167,240179,246355,246391,246393,246411,249413,269336,288472"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dbt-duckdb

      - name: Check secrets are present
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
        run: |
          missing=""
          [ -z "$MOTHERDUCK_TOKEN" ]  && missing="$missing MOTHERDUCK_TOKEN"
          [ -z "$PURPLEAIR_API_KEY" ] && missing="$missing PURPLEAIR_API_KEY"
          if [ -n "$missing" ]; then
            echo "ERROR: the following repo secrets are missing or empty:$missing"
            echo "Go to https://github.com/jokonkwo/hfa-platform/settings/secrets/actions"
            echo "and add each as a Repository secret (not an Environment secret)."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Run ingestion
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
        run: |
          python -m pipelines.ingestion.purpleair.cli load-raw

      - name: Run realtime dbt models
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          cd warehouse/dbt
          dbt run --select tag:realtime --target motherduck
