# PurpleAir ingestion.
#
# PAUSED: continuous 10-minute ingestion is deliberately off while PurpleAir API
# point budget is confirmed sustainable. The pipeline is proven working end to end.
# To resume: re-enable the cron-job.org job and optionally restore the on.schedule
# fallback below. Nothing needs to be rebuilt.
#
# TRIGGER: workflow_dispatch only — supports manual runs via the Actions tab or
# `gh workflow run ingest.yml`, and will accept calls from cron-job.org when
# the external scheduler is re-enabled.
#
# See docs/scheduling.md for the full setup guide.

name: Ingest PurpleAir

on:
  workflow_dispatch:

jobs:
  load-raw:
    name: Load raw PurpleAir readings
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      HFA_ENV: staging
      HFA_WAREHOUSE_MODE: motherduck
      MOTHERDUCK_DATABASE: hfa_dev
      PURPLEAIR_SENSOR_IDS: "473,8892,27111,29869,39049,42291,42327,46571,62137,80125,83229,85495,85615,87251,97847,104230,111391,114721,121933,123359,124099,134022,155829,163097,163115,163163,163167,167071,189863,197623,198871,237167,240179,246355,246391,246393,246411,249413,269336,288472"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dbt-duckdb" "duckdb==1.5.4"

      - name: Check secrets are present
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
        run: |
          missing=""
          [ -z "$MOTHERDUCK_TOKEN" ]  && missing="$missing MOTHERDUCK_TOKEN"
          [ -z "$PURPLEAIR_API_KEY" ] && missing="$missing PURPLEAIR_API_KEY"
          if [ -n "$missing" ]; then
            echo "ERROR: the following repo secrets are missing or empty:$missing"
            echo "Go to https://github.com/jokonkwo/hfa-platform/settings/secrets/actions"
            echo "and add each as a Repository secret (not an Environment secret)."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Run ingestion
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
        run: |
          python -m pipelines.ingestion.purpleair.cli load-raw

      - name: Run realtime dbt models
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          cd warehouse/dbt
          dbt run --select tag:realtime --target motherduck
