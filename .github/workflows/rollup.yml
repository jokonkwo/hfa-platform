# Hourly and daily rollup transforms.
#
# PAUSED: rollup cadence is deliberately off while continuous ingestion is paused
# (no point rolling up data that isn't accumulating). See ingest.yml and
# docs/scheduling.md. To resume: re-enable the cron-job.org entry for this workflow.
#
# TRIGGER: workflow_dispatch only — supports manual runs and cron-job.org calls
# when the external scheduler is re-enabled.

name: Rollup transforms

on:
  workflow_dispatch:

jobs:
  rollup:
    name: Run hourly and daily rollup models
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      HFA_ENV: staging
      HFA_WAREHOUSE_MODE: motherduck
      MOTHERDUCK_DATABASE: hfa_dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-duckdb" "duckdb==1.5.4"

      - name: Run rollup models
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          cd warehouse/dbt
          dbt run --select tag:hourly tag:daily --target motherduck
